name: Silpo promo watcher

on:
  schedule:
    - cron: "0 7 * * *"    # 07:00 UTC щодня
    - cron: "0 15 * * *"   # 15:00 UTC щодня
  workflow_dispatch: {}

jobs:
  check-promos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run promo watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python promo/silpo_promo.py

      - name: Save seen state
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add promo/seen_promo.json
          git diff --staged --quiet || git commit -m "Update seen promo state"
          git push
